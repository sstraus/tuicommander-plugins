name: Release Plugins

on:
  push:
    branches: [main]
    paths:
      - "*/manifest.json"
      - "*/main.js"
      - "*/icon-data.js"
      - "*/icon-map.json"
      - "registry.json"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package plugins
        run: |
          mkdir -p dist
          for dir in */; do
            [ -f "$dir/manifest.json" ] || continue
            plugin_id=$(basename "$dir")
            version=$(jq -r .version "$dir/manifest.json")
            echo "Packaging $plugin_id v$version"
            (cd "$dir" && zip -r "../dist/${plugin_id}.zip" . -x "node_modules/*" "scripts/*" ".claude/*" "package*.json")
          done
          ls -la dist/

      - name: Update or create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          # Delete existing release if present
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          # Create new release with all zips
          gh release create "$TAG" dist/*.zip \
            --title "Plugin Releases" \
            --notes "Auto-generated plugin packages. Updated on every push to main." \
            --latest
